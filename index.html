<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawaii Feierabend-Rechner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 25px 15px;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #6b3150;
      background:
        radial-gradient(circle at 15% 15%, #ffffff 0 4px, transparent 5px),
        radial-gradient(circle at 85% 10%, #ffffff 0 3px, transparent 4px),
        radial-gradient(circle at 75% 82%, #ffffff 0 5px, transparent 6px),
        linear-gradient(135deg, #ffd9ea, #fce7f3, #e9d5ff);
    }

    .card {
      width: min(100%, 500px);
      position: relative;
      padding: 34px 30px;
      overflow: hidden;
      border: 4px solid #ffffff;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 15px 35px rgba(219, 39, 119, 0.2);
    }

    .corner-decoration {
      position: absolute;
      opacity: 0.55;
      font-size: 3rem;
    }

    .top-left {
      top: 12px;
      left: 16px;
    }

    .top-right {
      top: 12px;
      right: 16px;
    }

    h1 {
      margin: 5px 0 8px;
      color: #db2777;
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      text-align: center;
    }

    .intro {
      margin: 0 0 28px;
      color: #a14c78;
      line-height: 1.5;
      text-align: center;
    }

    .section-title {
      display: block;
      margin: 22px 0 10px;
      color: #be185d;
      font-weight: bold;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-box {
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #9d174d;
      font-size: 0.9rem;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 10px;
      border: 2px solid #f9a8d4;
      border-radius: 14px;
      color: #6b3150;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      background: #fff8fc;
    }

    input:focus {
      outline: none;
      border-color: #ec4899;
      box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.16);
    }

    .hint {
      margin: 7px 0 0;
      color: #b76a90;
      font-size: 0.78rem;
      text-align: center;
    }

    .pause-input {
      width: 100%;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      border: 3px solid #ffffff;
      border-radius: 16px;
      color: white;
      font-size: 1.05rem;
      font-weight: bold;
      background: linear-gradient(135deg, #f472b6, #db2777);
      box-shadow: 0 6px 0 #be185d;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #be185d;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #be185d;
    }

    .error {
      min-height: 22px;
      margin-top: 14px;
      color: #e11d48;
      font-size: 0.92rem;
      font-weight: bold;
      text-align: center;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 22px 16px;
      border: 3px dashed #f472b6;
      border-radius: 20px;
      text-align: center;
      background: linear-gradient(135deg, #fff1f7, #fdf4ff);
    }

    .result.visible {
      display: block;
      animation: popIn 0.35s ease;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.93);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .result p {
      margin: 0 0 8px;
      color: #a21c5b;
      font-weight: bold;
    }

    .end-time {
      margin: 7px 0;
      color: #db2777;
      font-size: clamp(2.5rem, 12vw, 4rem);
      font-weight: 900;
      letter-spacing: 2px;
    }

    .small-result {
      margin-top: 10px !important;
      color: #a76a86 !important;
      font-size: 0.85rem;
      font-weight: normal !important;
    }

    .footer-hearts {
      margin-top: 24px;
      color: #f472b6;
      letter-spacing: 8px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="corner-decoration top-left">🌸</div>
    <div class="corner-decoration top-right">✨</div>

    <h1>🩷 Feierabend-Rechner</h1>
    <p class="intro">
      Wann ist heute wohl Feierabend? Gib deine Zeiten ein und finde es heraus. ✨
    </p>

    <span class="section-title">🕒 Arbeitsbeginn – 24-Stunden-Format</span>

    <div class="input-row">
      <div class="input-box">
        <label for="startStunden">Stunden</label>
        <input id="startStunden" type="number" min="0" max="23" value="8">
        <p class="hint">0 bis 23</p>
      </div>

      <div class="input-box">
        <label for="startMinuten">Minuten</label>
        <input id="startMinuten" type="number" min="0" max="59" value="0">
        <p class="hint">0 bis 59</p>
      </div>
    </div>

    <span class="section-title">💼 Arbeitszeit</span>

    <div class="input-row">
      <div class="input-box">
        <label for="arbeitsStunden">Stunden</label>
        <input id="arbeitsStunden" type="number" min="0" max="24" value="8">
      </div>

      <div class="input-box">
        <label for="arbeitsMinuten">Minuten</label>
        <input id="arbeitsMinuten" type="number" min="0" max="59" value="0">
      </div>
    </div>

    <span class="section-title">☕ Pausenzeit</span>

    <label for="pause" style="font-weight:normal; color:#a14c78;">
      Pause in Minuten <span style="font-size:0.8rem;">(optional)</span>
    </label>
    <input class="pause-input" id="pause" type="number" min="0" max="300" value="0">

    <button id="berechnenButton">✨ Feierabend berechnen ✨</button>

    <div class="error" id="fehler"></div>

    <section class="result" id="ergebnis">
      <p>Du könntest Feierabend machen um:</p>
      <div class="end-time" id="feierabendZeit">16:00</div>
      <p>Uhr 🎀</p>
      <p class="small-result" id="zusatzInfo"></p>
    </section>

    <div class="footer-hearts">♥ ♥ ♥</div>
  </main>

  <script>
    const startStundenInput = document.getElementById("startStunden");
    const startMinutenInput = document.getElementById("startMinuten");

    const arbeitsStundenInput = document.getElementById("arbeitsStunden");
    const arbeitsMinutenInput = document.getElementById("arbeitsMinuten");

    const pauseInput = document.getElementById("pause");

    const berechnenButton = document.getElementById("berechnenButton");
    const ergebnis = document.getElementById("ergebnis");
    const feierabendZeit = document.getElementById("feierabendZeit");
    const zusatzInfo = document.getElementById("zusatzInfo");
    const fehler = document.getElementById("fehler");

    function zweiStellen(zahl) {
      return String(zahl).padStart(2, "0");
    }

    function feierabendBerechnen() {
      const startStunden = Number(startStundenInput.value);
      const startMinuten = Number(startMinutenInput.value);

      const arbeitsStunden = Number(arbeitsStundenInput.value);
      const arbeitsMinuten = Number(arbeitsMinutenInput.value);

      const pause = Number(pauseInput.value);

      fehler.textContent = "";
      ergebnis.classList.remove("visible");

      const ungueltig =
        startStunden < 0 || startStunden > 23 ||
        startMinuten < 0 || startMinuten > 59 ||
        arbeitsStunden < 0 || arbeitsStunden > 24 ||
        arbeitsMinuten < 0 || arbeitsMinuten > 59 ||
        pause < 0;

      if (ungueltig) {
        fehler.textContent = "Bitte gib gültige Uhrzeiten ein, cutie! 💕";
        return;
      }

      // Alle Werte in Minuten umrechnen
      const arbeitsbeginnInMinuten = startStunden * 60 + startMinuten;
      const arbeitszeitInMinuten = arbeitsStunden * 60 + arbeitsMinuten;
      const feierabendInMinuten =
        arbeitsbeginnInMinuten + arbeitszeitInMinuten + pause;

      // Prüfen, ob die Zeit am nächsten Tag liegt
      const naechsterTag = feierabendInMinuten >= 24 * 60;

      // Uhrzeit auf 24 Stunden begrenzen
      const endzeitHeute = feierabendInMinuten % (24 * 60);
      const endStunden = Math.floor(endzeitHeute / 60);
      const endMinuten = endzeitHeute % 60;

      feierabendZeit.textContent =
        zweiStellen(endStunden) + ":" + zweiStellen(endMinuten);

      let info =
        "Start: " + zweiStellen(startStunden) + ":" + zweiStellen(startMinuten) +
        " Uhr · Arbeitszeit: " + arbeitsStunden + " Std. " + arbeitsMinuten + " Min.";

      if (pause > 0) {
        info += " · Pause: " + pause + " Min.";
      }

      if (naechsterTag) {
        info += " · Feierabend am nächsten Tag 🌙";
      }

      zusatzInfo.textContent = info;
      ergebnis.classList.add("visible");
    }

    berechnenButton.addEventListener("click", feierabendBerechnen);

    // Enter funktioniert in allen Eingabefeldern
    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          feierabendBerechnen();
        }
      });
    });

    // Direkt beim Öffnen eine Beispielzeit anzeigen
    feierabendBerechnen();
  </script>
</body>
</html>
